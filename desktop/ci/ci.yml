name: CI

on:
  pull_request: {}
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --all-targets -- -D warnings

  # The dev host is macOS, so nothing here compiles the Linux-only code paths
  # or proves the gpui system dependencies are still the right set. This job is
  # the only thing that does.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libasound2-dev libfontconfig-dev libssl-dev libvulkan1 \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
