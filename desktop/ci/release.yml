name: Release

# A version bump on main is the release. Nothing else to remember: push a
# workspace Cargo.toml with a new version and this tags it, publishes the
# release, and uploads every artifact to it.
on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.app.outputs.name }}
      slug: ${{ steps.app.outputs.slug }}
      repo: ${{ steps.app.outputs.repo }}
      desc: ${{ steps.app.outputs.desc }}
    steps:
      - uses: actions/checkout@v5

      - name: Read app metadata
        id: app
        run: |
          . packaging/app.env
          {
            echo "name=$APP_NAME"
            echo "slug=$APP_SLUG"
            echo "repo=$APP_REPO"
            echo "desc=$APP_DESC"
          } >> "$GITHUB_OUTPUT"

      - name: Read workspace version
        id: version
        run: |
          VERSION=$(sed -n 's/^version = "\([0-9][^"]*\)".*/\1/p' Cargo.toml | head -1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Release when the workspace version has no tag yet. Idempotent for both
      # push and manual dispatch — a HEAD~1 diff would miss dispatches and
      # re-released versions.
      - name: Decide whether to release
        id: decide
        run: |
          NEW="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/v${NEW}" | grep -q .; then
            echo "v${NEW} already released — skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Create git tag
        run: |
          git tag "v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"

      # The changelog says what changed for the person installing this; commit
      # subjects say which files moved. Prefer the former, and fall back to
      # generated notes when the version has no section yet.
      - name: Release notes
        id: notes
        run: |
          if scripts/notes.sh "${{ needs.check-version.outputs.version }}" > "$RUNNER_TEMP/notes.md"; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CHANGELOG section for ${{ needs.check-version.outputs.version }} — using generated notes."
            : > "$RUNNER_TEMP/notes.md"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check-version.outputs.version }}"
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          draft: false

  macos:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: macos-latest
    # Signing credentials are optional. With a Developer ID the app is signed
    # with a hardened runtime and notarized; without them the build falls back
    # to an ad-hoc signature — it runs locally but Gatekeeper will warn.
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APP_NAME: ${{ needs.check-version.outputs.name }}
      APP_SLUG: ${{ needs.check-version.outputs.slug }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "v${{ needs.check-version.outputs.version }}"

      # Tells build.rs this build IS the release of its version, so the About
      # card says "Released <date>" instead of "Development build".
      - name: Mark this a release build
        run: |
          . packaging/app.env
          echo "${APP_ENV}_RELEASE=1" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Import signing certificate
        if: env.APPLE_SIGNING_IDENTITY != ''
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # A temporary keychain, wiped when the job ends, so codesign can find
          # the Developer ID cert.
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build + bundle (.app)
        run: |
          export CODESIGN_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          scripts/bundle.sh

      - name: Notarize app
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "dist/$APP_NAME.app" "$RUNNER_TEMP/$APP_NAME.zip"
          xcrun notarytool submit "$RUNNER_TEMP/$APP_NAME.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/$APP_NAME.app"

      - name: Package (.dmg)
        run: |
          export CODESIGN_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          scripts/dmg.sh

      - name: Notarize dmg
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          set -euo pipefail
          xcrun notarytool submit "dist/$APP_NAME.dmg" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/$APP_NAME.dmg"

      - name: Verify bundle
        run: |
          codesign --verify --strict --verbose=2 "dist/$APP_NAME.app"
          test -x "dist/$APP_NAME.app/Contents/MacOS/$APP_SLUG"
          test -f "dist/$APP_NAME.app/Contents/Resources/icon.icns"
          if [ -z "${APPLE_SIGNING_IDENTITY}" ]; then
            echo "::warning::Ad-hoc build — unsigned and not notarized; Gatekeeper will warn on install."
          fi

      # The in-app updater verifies a downloaded DMG against the Developer ID
      # requirement, and against this digest when the release publishes one.
      - name: Checksum DMG
        run: shasum -a 256 "dist/$APP_NAME.dmg" | awk '{print $1}' > "dist/$APP_NAME.dmg.sha256"

      - name: Upload to release
        run: |
          gh release upload "v${{ needs.check-version.outputs.version }}" \
            "dist/$APP_NAME.dmg" "dist/$APP_NAME.dmg.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "v${{ needs.check-version.outputs.version }}"

      - name: Mark this a release build
        run: |
          . packaging/app.env
          echo "${APP_ENV}_RELEASE=1" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang curl file desktop-file-utils \
            libasound2-dev libfontconfig-dev libssl-dev libvulkan1 \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build + package
        run: scripts/linux.sh ${{ matrix.arch }}

      # An AppImage has no signature to check, so its published SHA-256 is what
      # the in-app updater verifies before it overwrites the running image.
      - name: Checksum artifacts
        run: |
          cd dist/linux
          for f in *.tar.gz *.deb *.AppImage; do
            [ -e "$f" ] || continue
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          done

      - name: Upload to release
        run: |
          gh release upload "v${{ needs.check-version.outputs.version }}" \
            dist/linux/*.tar.gz dist/linux/*.deb dist/linux/*.AppImage \
            dist/linux/*.sha256 --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "v${{ needs.check-version.outputs.version }}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build + package (.zip + .msi)
        shell: pwsh
        run: scripts/windows.ps1 -Arch x86_64

      - name: Pack Chocolatey (.nupkg)
        shell: pwsh
        run: |
          $version = "${{ needs.check-version.outputs.version }}"
          $slug = "${{ needs.check-version.outputs.slug }}"
          $zip = "dist/windows/$slug-$version-windows-x86_64.zip"
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          (Get-Content packaging/chocolatey/app.nuspec) -replace '0\.0\.0', $version |
            Set-Content packaging/chocolatey/app.nuspec
          (Get-Content packaging/chocolatey/tools/chocolateyinstall.ps1) -replace '0\.0\.0', $version -replace '0{64}', $sha |
            Set-Content packaging/chocolatey/tools/chocolateyinstall.ps1
          choco pack packaging/chocolatey/app.nuspec --outputdirectory dist/windows

      - name: Upload to release
        shell: pwsh
        run: |
          $v = "${{ needs.check-version.outputs.version }}"
          $assets = Get-ChildItem -Path dist/windows/* -Include *.zip, *.msi, *.nupkg
          gh release upload "v$v" $assets.FullName --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  homebrew:
    runs-on: ubuntu-latest
    needs: [check-version, macos]
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - name: Download DMG and compute SHA
        id: sha
        env:
          NAME: ${{ needs.check-version.outputs.name }}
          REPO: ${{ needs.check-version.outputs.repo }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          URL="https://github.com/${REPO}/releases/download/v${VERSION}/${NAME}.dmg"
          # The release is published before CI finishes uploading to it, so the
          # asset can 404 for a few minutes.
          for i in $(seq 1 30); do
            if curl -fsSL -o /tmp/app.dmg "${URL}" 2>/dev/null; then break; fi
            echo "Waiting for ${NAME}.dmg... ($i/30)"
            sleep 10
          done
          echo "value=$(sha256sum /tmp/app.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew tap
        uses: actions/checkout@v5
        with:
          repository: wess/homebrew-packages
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask
        env:
          NAME: ${{ needs.check-version.outputs.name }}
          SLUG: ${{ needs.check-version.outputs.slug }}
          REPO: ${{ needs.check-version.outputs.repo }}
          DESC: ${{ needs.check-version.outputs.desc }}
          SHA: ${{ steps.sha.outputs.value }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          mkdir -p tap/Casks
          cat > "tap/Casks/${SLUG}.rb" << RUBY
          cask "${SLUG}" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/${REPO}/releases/download/v#{version}/${NAME}.dmg"
            name "${NAME}"
            desc "${DESC}"
            homepage "https://github.com/${REPO}"

            depends_on macos: :big_sur

            app "${NAME}.app"

            zap trash: [
              "~/Library/Application Support/${NAME}",
              "~/Library/Preferences/${SLUG}.plist",
              "~/.${SLUG}",
            ]
          end
          RUBY

      - name: Push updated cask
        env:
          SLUG: ${{ needs.check-version.outputs.slug }}
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Casks/${SLUG}.rb"
          if git diff --cached --quiet; then
            echo "Cask unchanged — skipping push."
          else
            git commit -m "Update ${SLUG} to v${{ needs.check-version.outputs.version }}"
            git push
          fi

  # Refresh the in-repo Scoop manifest with the released zip's URL and SHA-256.
  # Non-fatal: if pushing to a protected main is blocked the release still
  # succeeds, and the manifest can be updated by hand.
  scoop:
    runs-on: ubuntu-latest
    needs: [check-version, windows]
    if: needs.check-version.outputs.changed == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Update Scoop manifest
        env:
          SLUG: ${{ needs.check-version.outputs.slug }}
          REPO: ${{ needs.check-version.outputs.repo }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          URL="https://github.com/${REPO}/releases/download/v${VERSION}/${SLUG}-${VERSION}-windows-x86_64.zip"
          for i in $(seq 1 30); do
            if curl -fsSL -o /tmp/p.zip "${URL}" 2>/dev/null; then break; fi
            echo "Waiting for the windows zip... ($i/30)"; sleep 10
          done
          SHA=$(sha256sum /tmp/p.zip | cut -d' ' -f1)
          python3 - "$VERSION" "$SHA" "$SLUG" "$REPO" << 'PY'
          import json, sys
          version, sha, slug, repo = sys.argv[1:5]
          path = "packaging/scoop/app.json"
          with open(path) as f:
              m = json.load(f)
          m["version"] = version
          a = m["architecture"]["64bit"]
          a["url"] = f"https://github.com/{repo}/releases/download/v{version}/{slug}-{version}-windows-x86_64.zip"
          a["hash"] = sha
          a["extract_dir"] = f"{slug}-{version}-windows-x86_64"
          with open(path, "w") as f:
              json.dump(m, f, indent=4)
              f.write("\n")
          PY

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/scoop/app.json
          if git diff --cached --quiet; then
            echo "Scoop manifest unchanged."
            exit 0
          fi
          git commit -m "Update Scoop manifest to v${{ needs.check-version.outputs.version }}"
          # This job starts after the Windows build, by which time main has
          # often moved — the release commit is rarely the last one pushed. A
          # plain push is then rejected non-fast-forward and the manifest
          # silently misses the release. The manifest is the only file touched,
          # so a rebase has nothing to conflict with.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected — rebasing onto origin/main (attempt ${attempt})."
            git pull --rebase --autostash origin main
            sleep 5
          done
          echo "::error::Could not push the Scoop manifest after 5 attempts."
          exit 1
