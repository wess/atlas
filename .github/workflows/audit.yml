name: Dependency audit

on:
  pull_request:
    paths: ["**/Cargo.toml", "**/Cargo.lock", "**/package.json", "web/bun.lock", ".github/workflows/audit.yml"]
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "**/Cargo.lock", "**/package.json", "web/bun.lock", ".github/workflows/audit.yml"]
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun audit
        working-directory: web
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit library and template lockfiles
        run: |
          for lock in desktop/Cargo.lock desktop/templates/*/Cargo.lock; do
            cargo audit --file "$lock"
          done
