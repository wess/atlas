name: Release

# a release is complete only when every tested library is available from this repository

on:
  push:
    branches: [main]
    paths: ["web/package.json"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

# The library artifacts are the web half. `desktop/` releases through its own
# scaffolded apps, not from here.
defaults:
  run:
    working-directory: web

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read package version
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # a tag alone does not establish that all release assets were uploaded
      - name: Decide whether to release
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW="${{ steps.version.outputs.version }}"
          if DRAFT=$(gh api "repos/wess/atlas/releases/tags/v${NEW}" --jq '.draft' 2>/tmp/releasecheck.log); then
            echo "changed=${DRAFT}" >> "$GITHUB_OUTPUT"
          elif rg -q 'HTTP 404' /tmp/releasecheck.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/releasecheck.log >&2
            exit 1
          fi

  test:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check
      - run: bun test
      - run: bun run distribution:build
      - run: bun run distribution:verify
      - run: bun run fixtures:verify out/distribution /tmp/atlasfixtures
      - name: Install pinned local S3 test server
        run: |
          curl --fail --location --silent --show-error https://github.com/rustfs/rustfs/releases/download/1.0.3/rustfs-linux-x86_64-gnu-v1.0.3.zip --output /tmp/atlasrustfs.zip
          echo "0cb0924df93734d14f708004eff4b0e48a147fbdc074756ca0d6b8ec919629b8  /tmp/atlasrustfs.zip" | sha256sum --check --status
          unzip -q /tmp/atlasrustfs.zip -d /tmp/atlasrustfs
          chmod +x /tmp/atlasrustfs/rustfs
      - run: bun run storage:verify /tmp/atlasrustfs/rustfs out/distribution
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-libraries
          path: |
            web/out/distribution/*.tgz
            web/out/distribution/catalog.json
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs: [check-version, test]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atlas-libraries
          path: web/out/distribution

      - name: Verify tested library artifacts
        run: bun distribution/publish.ts

      - name: Upload and verify GitHub release assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun distribution/release.ts

      - name: Verify GitHub release artifact integrity
        run: bun distribution/publish.ts --verify-release
