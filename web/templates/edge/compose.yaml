services:
  app:
    build: .
    command: ["bun", "run", "app.ts"]
    environment:
      APP_PORT: "3000"
    expose:
      - "3000"
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  edge:
    build: .
    command: ["bun", "run", "edge.ts"]
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      APP_URL: "http://app:3000"
      CERT_DIR: "/var/atlas/edge"
      ACME_STAGING: ${ACME_STAGING:-}
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - certs:/var/atlas/edge
    depends_on:
      - app
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  certs:
